<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="feltGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Outer Charcoal Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Billiard Felt Table Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#feltGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Billiard Cue Sticks crossed subtly -->
  <line x1="120" y1="392" x2="392" y2="120" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  <line x1="120" y1="120" x2="392" y2="392" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" opacity="0.4" />

  <!-- Center Ball Shield with Level Up Brand -->
  <circle cx="256" cy="256" r="100" fill="#090d16" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Brand Typography -->
  <text x="256" y="246" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">LEVEL</text>
  <text x="256" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#10b981" text-anchor="middle" letter-spacing="6">UP</text>

  <!-- Arena Location Star -->
  <circle cx="256" cy="326" r="4" fill="#fbbf24" />
</svg>
